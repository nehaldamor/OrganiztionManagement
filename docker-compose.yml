services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flowtenant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Backend/.env}
      POSTGRES_DB: ${POSTGRES_DB:-flowtenant}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-flowtenant} -d ${POSTGRES_DB:-flowtenant}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    command: ["sh", "-c", "npm run prisma:deploy && npm run prisma:seed"]
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-flowtenant}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-flowtenant}?schema=public"
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:?Set PLATFORM_ADMIN_EMAIL in Backend/.env}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:?Set PLATFORM_ADMIN_PASSWORD in Backend/.env}
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-flowtenant}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-flowtenant}?schema=public"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in Backend/.env}
      PORT: 3000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      EMAIL: ${EMAIL:-}
      PASSWORD: ${PASSWORD:-}
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
